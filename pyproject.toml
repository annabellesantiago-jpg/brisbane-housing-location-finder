[project]
name = "brisbane-house-finder"
version = "0.1.0"
requires-python = ">=3.12"


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "spark: needs a Spark session (local PySpark, or Databricks via notebooks/run_tests)",
]


[tool.ruff]
line-length = 100
target-version = "py312"


[tool.ruff.lint]
select = ["E", "W", "F", "I", "N"]


[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["E402", "F821"]
